<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>不遇 · 枫桥夜泊</title>
    <link rel="preload" as="fetch" href="models/bridge.glb" />
    <link rel="preload" as="fetch" href="images/night_512.hdr" />
    <link rel="preload" as="image" href="images/scenes/tavern.jpg" />
    <script type="module" crossorigin src="./assets/index-BDerFbSH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DVll8RWr.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene" role="img" aria-label="枫桥夜泊 3D 场景：船头、铜铃、石桥与水面" aria-keyshortcuts="Space"></canvas>
      <div id="vignette"></div>
      <div id="webgl-fallback" class="webgl-fallback hidden" role="alert"><p>这艘船需要 WebGL。<br>请换用最新版 Chrome / Edge / Safari，或开启硬件加速后刷新。</p></div>
      <button id="mute-btn" class="mute-btn" type="button" aria-label="静音" aria-pressed="false">声</button>

      <div id="entry" class="overlay">
        <div class="entry-inner">
          <div class="seal">不遇</div>
          <h1>大唐失意者</h1>
          <p class="sub">枫桥夜泊 · 三秒听钟</p>
          <button id="enter-btn" type="button">进入</button>
          <p class="hint">建议戴耳机 · 进入后请稍等三秒</p>
        </div>
      </div>

      <div id="loading" class="loading" role="status" aria-live="polite">水面与钟声正在靠近…</div>
      <div id="hint" class="hint hidden">点击铜铃 / 空格</div>
      <div id="subtitles" aria-live="polite" aria-atomic="true"></div>
      <div id="poem"></div>

      <button id="story-next" class="story-cta hidden" type="button">低头看船头</button>
      <div id="story-root"></div>
      <canvas id="card-canvas" width="1080" height="1920" class="offscreen"></canvas>

      <div id="debug" class="debug hidden"></div>
    </div>
  </body>
</html>
